services:
  postgres:
    image: postgres:16-alpine
    container_name: builderos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: builderos
      POSTGRES_PASSWORD: builderos_dev
      POSTGRES_DB: builderos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U builderos -d builderos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: builderos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
